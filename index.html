<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flyers Funkos — Palm Beach Sale</title>

<style>
  :root{
    --ink:#141018;
    --paper:#efe9e0;
    --card:#ffffff;
    --line:#141018;
    --accent:#ff5a36;
    --accent-2:#2c6e49;
    --muted:#7a7368;
    --tag:#f4c518;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle, rgba(20,16,24,0.07) 1px, transparent 1px);
    background-size: 14px 14px;
    color:var(--ink);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding-bottom:80px;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:4px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{
    margin:0;
    font-family: Georgia, 'Times New Roman', serif;
    font-weight:900;
    font-style:italic;
    font-size:clamp(28px,6vw,44px);
    letter-spacing:-0.5px;
  }
  header .sub{
    margin-top:4px;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--tag);
    font-weight:700;
  }
  .toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    padding:16px 20px;
    background:var(--paper);
    border-bottom:2px dashed var(--ink);
    position:sticky;
    top:96px;
    z-index:19;
  }
  .toolbar input[type=text]{
    flex:1;
    min-width:160px;
    padding:10px 14px;
    border:2px solid var(--ink);
    border-radius:999px;
    font-size:14px;
    background:var(--card);
  }
  .btn{
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:10px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.outline{
    background:transparent;
    color:var(--ink);
  }
  .btn.accent{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .count-pill{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border:2px solid var(--ink);

  #progress{
    padding:0 20px;
    font-size:12px;
    color:var(--muted);
    display:none;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:22px;
    padding:24px 20px 60px;
  }
  .card{
    background:var(--card);
    border:3px solid var(--ink);
    border-radius:4px;
    box-shadow:6px 6px 0 var(--ink);

    display:flex;

    flex-direction:column;
    gap:10px;
  }
  .photo-box{

    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f7f4ee;
    cursor:pointer;
    position:relative;
    overflow:hidden;

  .photo-box img{

    height:100%;

    background:#fff;
  }
  .photo-box .placeholder{

    color:var(--muted);

    padding:10px;

    justify-content:center;
    background:#eef1f8;

  footer{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    padding:20px;
  }
  @media (max-width:480px){
    .toolbar{top:88px;}
  }
</style>

// iPadOS reports as "MacIntosh" with touch support, so check that too.
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// Safari on iOS/iPadOS ignores the `download` attribute, so the file never
// reaches the Files/Photos app that way. Instead, open the image full-screen
// in a new tab so the person can long-press it and choose "Add to Photos".
async function saveCanvasImage(canvas, filename, preOpenedWin) {
  if (navigator.share && canvas.toBlob) {
    // Best path on iOS: native share sheet has a real "Save Image" option.
    try {
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const file = new File([blob], filename, {type: 'image/png'});
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        if (preOpenedWin) preOpenedWin.close();
        await navigator.share({files: [file], title: filename});
        return;
      }
    } catch (err) {
      // Fall through to the other methods below if sharing was cancelled or unsupported.
    }
  }
  if (isIOS) {
    const win = preOpenedWin && !preOpenedWin.closed ? preOpenedWin : window.open();
    if (win) {
      win.document.write(`<img src="${canvas.toDataURL('image/png')}" style="width:100%;height:auto;">`);
      win.document.title = filename;
    } else {
      alert('Habilita las ventanas emergentes para este sitio en Ajustes > Safari, o abre este archivo directamente en Safari (no dentro de la app de Claude) para poder guardar la imagen.');
    }
    return;
  }
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const hideNoPhoto = document.getElementById('btnHideDone').dataset.active === 'true';
  let visible = 0;
  document.querySelectorAll('.card').forEach(card => {
    const matchesSearch = !q || card.dataset.name.includes(q) || card.dataset.num.includes(q);
    const matchesPhoto = !hideNoPhoto || card.dataset.hasPhoto === 'true';
    const show = matchesSearch && matchesPhoto;
    card.dataset.hidden = show ? 'false' : 'true';
    if (show) visible++;
  });
  visibleCount.textContent = visible + ' / ' + FUNKOS.length;
}

document.getElementById('search').addEventListener('input', applyFilter);

const btnHideDone = document.getElementById('btnHideDone');
btnHideDone.dataset.active = 'false';
btnHideDone.addEventListener('click', () => {
  const active = btnHideDone.dataset.active === 'true';
  btnHideDone.dataset.active = active ? 'false' : 'true';
  btnHideDone.textContent = active ? 'Ocultar sin foto' : 'Mostrar todos';
  applyFilter();
});

document.getElementById('btnZip').addEventListener('click', async () => {
  const progress = document.getElementById('progress');
  const targets = Array.from(document.querySelectorAll('.card')).filter(c => c.dataset.hasPhoto === 'true');
  if (targets.length === 0) {
    alert('Agrega al menos una foto antes de descargar el ZIP.');
    return;
  }
  if (isIOS) {
    alert('En iPad el ZIP no siempre se guarda bien. Mejor usa "Descargar" en cada tarjeta \u2014 se abrir\u00e1n para que las guardes una por una en Fotos.');
    return;
  }
  progress.style.display = 'block';
  const zip = new JSZip();
  for (let i = 0; i < targets.length; i++) {
    const card = targets[i];
    progress.textContent = `Generando ${i+1} / ${targets.length}...`;
    const canvas = await html2canvas(card.querySelector('.flyer'), {scale: 3, backgroundColor: '#ffffff'});
    const dataUrl = canvas.toDataURL('image/png').split(',')[1];
    const name = card.querySelector('.name').textContent.replace(/[^a-z0-9]+/gi, '_');
    zip.file(name + '.png', dataUrl, {base64: true});
  }
  progress.textContent = 'Empaquetando ZIP...';
  const blob = await zip.generateAsync({type: 'blob'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'flyers_funkos.zip';
  link.click();
  progress.style.display = 'none';
});
</script>
</body>
