    gap:14px;
  }

    border:4px solid var(--ink);

    font-size:13px;
    color:var(--ink);
    transform:rotate(-9deg);
    box-shadow:3px 3px 0 rgba(0,0,0,.5);

  header h1{

    font-family:'Bungee', cursive;
    font-weight:400;
    font-size:clamp(26px,7vw,42px);

    letter-spacing:0.5px;
    color:#fff;

    flex-wrap:wrap;

    top:98px;
    z-index:19;

  .search-wrap{

    flex:1;
    min-width:160px;
  }
  .toolbar input[type=text]{

    padding:11px 40px 11px 16px;
    border:3px solid var(--ink);
    border-radius:999px;
    font-size:14px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    background:#fff;

  }
  .toolbar input[type=text]:focus{

    box-shadow:0 0 0 3px var(--yellow);
  }

    position:absolute;

    top:50%;

    height:26px;
    border:none;
    border-radius:50%;
    background:var(--ink);
    color:#fff;
    font-size:13px;
    font-weight:800;
    line-height:1;
    cursor:pointer;
    align-items:center;
    justify-content:center;
  }
  #btnClearSearch.show{ display:flex; }
  .btn{

    background:#fff;
    color:var(--ink);
    padding:9px 16px;
    border-radius:999px;
    font-weight:800;
    font-size:12.5px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
  .btn.outline{ background:#fff; color:var(--ink); }
  .btn.accent{ background:var(--orange); border-color:var(--ink); color:#fff; }

    font-weight:700;
    padding:6px 12px;

    border-radius:999px;
    background:var(--blue);
    color:#fff;
  }
  #progress{

    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--ink);
    display:none;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:26px;
    padding:26px 20px 60px;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    box-shadow:7px 7px 0 rgba(12,12,18,.25);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .select-check{
    position:absolute;
    top:14px;
    left:14px;
    z-index:5;
    cursor:pointer;
    display:block;
  }
  .select-check input{
    position:absolute;
    opacity:0;
    width:26px;
    height:26px;
    margin:0;
    cursor:pointer;
  }
  .select-check span{
    display:block;
    width:26px;
    height:26px;
    border-radius:8px;
    background:rgba(0,0,0,.35);
    border:2.5px solid rgba(255,255,255,.55);
    box-sizing:border-box;
    transition:background .12s, border-color .12s;
  }
  .select-check input:checked + span{
    background:var(--orange);
    border-color:var(--ink);
  }
  .select-check input:checked + span::after{
    content:'✓';
    display:block;
    text-align:center;
    line-height:22px;
    color:#fff;
    font-weight:900;
    font-size:15px;
  }
  .card-stripe{ height:9px; background:var(--orange); position:relative; z-index:1; }

  .exclusive-tag{

    top:14px;
    right:-30px;
    background:var(--yellow);
    color:var(--ink);
    font-family:'Bungee',cursive;
    font-size:9.5px;
    padding:4px 34px;
    transform:rotate(40deg);
    box-shadow:0 2px 0 rgba(0,0,0,.4);
    z-index:3;
  }
  .flyer{
    padding:0;
    display:flex;
    flex-direction:column;
    position:relative;
    border-radius:16px 16px 0 0;
    background:var(--card);
    overflow:hidden;

  .flyer-body{
    padding:14px 14px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }

    border:3px solid #fff;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--window);
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.06);

    height:100%;

    padding:9px 4px;
    font-size:11px;

    background:#fff;

  footer{
    text-align:center;
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    color:var(--muted);
    padding:24px 20px;
  }
  @media (max-width:480px){
    .toolbar{top:104px;}
    header{flex-wrap:wrap;}
  }
</style>
</head>

// Cloud sync: photos upload to Cloudinary using a deterministic public_id per
// item, so any device can reconstruct the same URL and load the same photo —
// no separate database needed to look anything up.
const CLOUDINARY_CLOUD_NAME = 'zvp7ysdd';
const CLOUDINARY_UPLOAD_PRESET = 'funko_flyers';

function cloudinaryUrl(publicId) {
  return `https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}/image/upload/${publicId}`;
}

async function uploadToCloudinary(file, publicId) {
  const form = new FormData();
  form.append('file', file);
  form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  form.append('public_id', publicId);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: form
  });
  if (!res.ok) throw new Error('Cloudinary upload failed: ' + res.status);
  return res.json();
}

// Checks whether a Cloudinary URL actually resolves to an image (vs. a 404
// for an item nobody has uploaded yet).
function tryLoadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

// Save uploaded photos in the browser's own storage (IndexedDB) so they're
// still there next time this page loads on the same device — no re-uploading.
const DB_NAME = 'funkoFlyerPhotos';
const STORE_NAME = 'photos';
let dbPromise = null;
function getDB() {
  if (!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB not available'));
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function savePhotoToDB(key, dataUrl) {
  try {
    const db = await getDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put(dataUrl, key);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.warn('No se pudo guardar la foto localmente:', err);
  }
}
async function loadPhotoFromDB(key) {
  try {
    const db = await getDB();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (err) {
    return null;
  }
}
async function clearAllSavedPhotos() {
  try {
    const db = await getDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (err) {
    console.warn('No se pudieron borrar las fotos guardadas:', err);
  }
}

// Safari on iOS/iPadOS ignores the `download` attribute, so the file never
// reaches the Files/Photos app that way. Instead, open the image full-screen
// in a new tab so the person can long-press it and choose "Add to Photos".
async function saveCanvasImage(canvas, filename) {
  // 1) Native share sheet: works on iOS regardless of browser (Safari, Brave,
  // Chrome...) because it's a system UI, not a popup that shields can block.
  if (navigator.share && canvas.toBlob) {
    try {
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const file = new File([blob], filename, {type: 'image/png'});
      if (navigator.canShare && navigator.canShare({files: [file]})) {
        await navigator.share({files: [file], title: filename});
        return;
      }
    } catch (err) {
      // Cancelled or unsupported here — fall through to the next method.
    }
  }
  // 2) Blob + <a download>: more reliable on mobile WebKit than a data: URI,
  // and doesn't need popup permission at all.
  try {
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = filename;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    return;
  } catch (err) {
    // Fall through to the last-resort method below.
  }
  // 3) Last resort: open in a new tab so the image can be long-pressed and saved.
  const win = window.open();
  if (win) {
    win.document.write(`<img src="${canvas.toDataURL('image/png')}" style="width:100%;height:auto;">`);
    win.document.title = filename;
  } else {
    alert('No se pudo guardar. Revisa si tu navegador tiene bloqueadas las ventanas emergentes para este sitio (en Brave: toca el ícono del le\u00f3n junto a la barra de direcci\u00f3n > Site Settings > Pop-ups), o prueba abriendo esta p\u00e1gina en Safari.');
  }
}

// Some Funko Pop numbers repeat across different franchises (e.g. #463 is
// both Kenny and Hulk in this collection). Detect those collisions so their
// photo keys can be made unique — otherwise they'd overwrite each other's
// cloud photo.
const numCounts = {};
FUNKOS.forEach(f => { if (f.num) numCounts[f.num] = (numCounts[f.num] || 0) + 1; });
function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}
function photoKeyFor(f, i, prefix) {
  const base = f.num || `idx${i}`;
  const isDuplicateNum = f.num && numCounts[f.num] > 1;
  return isDuplicateNum ? `${prefix}_${base}_${slugify(f.name)}` : `${prefix}_${base}`;
}

FUNKOS.forEach((f, i) => {
  const id = 'card_' + i;
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.name = f.name.toLowerCase();
  card.dataset.num = f.num ? String(f.num) : '';
  card.dataset.hasPhoto = 'false';
  card.dataset.accent = i % 3;
  card.id = id;

  const theme = THEMES_BY_NAME[f.name] || THEMES[f.num];
  const flyerBg = theme
    ? `linear-gradient(155deg, ${theme.from} 0%, ${theme.to} 65%)`
    : null;
  if (theme) {
    card.style.boxShadow = `7px 7px 0 rgba(12,12,18,.25), 0 0 40px ${theme.glow} inset`;
  }

  const numTag = f.num ? ('#' + f.num) : 'POP';
  const hasPrice = f.price != null;
  const priceStr = hasPrice ? ('$' + f.price.toFixed(2)) : 'Consultar';
  const franchiseFontSize = theme ? (theme.name.length > 14 ? '7px' : '8.5px') : null;

  card.innerHTML = `
    <div class="flyer" id="${id}_flyer" style="${flyerBg ? `background:${flyerBg};` : ''}">
      <div class="card-stripe" style="${theme ? `background:${theme.stripe};` : ''}"></div>
      <div class="flyer-body">
        <div class="compare-row">
          <div class="photo-wrap">
            <div class="photo-box" data-idx="${i}">
              <div class="placeholder">
                Toca para<br>agregar foto
              </div>
            </div>
            <div class="price-badge my-price">${priceStr}</div>
          </div>
          <div class="photo-wrap">
            <div class="amazon-box" data-idx="${i}">
              <div class="placeholder">
                Screenshot<br>de Amazon
              </div>
            </div>
            ${f.amazonPrice != null ? `<div class="price-badge amazon-price">$${f.amazonPrice.toFixed(2)}</div>` : ''}
          </div>
        </div>
        <div class="info">
          <div class="name">${f.name}</div>
        </div>
        <div class="brand-strip">
          <span>Funko Pop</span>
          ${theme ? `<span class="franchise-tag-inline" style="font-size:${franchiseFontSize};">${theme.name}</span>` : ''}
          <span>${numTag}</span>
        </div>
      </div>
    </div>
    <label class="select-check">
      <input type="checkbox" class="select-box">
      <span></span>
    </label>
    <div class="card-actions">
      <button class="pick">Mi foto</button>
      <button class="pickAmazon">Foto Amazon</button>
      <button class="dl">Descargar</button>
    </div>
    <input type="file" accept="image/*" id="${id}_input">
    <input type="file" accept="image/*" id="${id}_input_amazon">
  `;
  grid.appendChild(card);

  const selectBox = card.querySelector('.select-box');
  selectBox.addEventListener('change', () => {
    card.dataset.selected = selectBox.checked ? 'true' : 'false';
    updateSelectedCount();
  });

  const photoBox = card.querySelector('.photo-box');
  const amazonBox = card.querySelector('.amazon-box');
  const fileInput = card.querySelector(`#${id}_input`);
  const amazonInput = card.querySelector(`#${id}_input_amazon`);
  const pickBtn = card.querySelector('.pick');
  const pickAmazonBtn = card.querySelector('.pickAmazon');
  const dlBtn = card.querySelector('.dl');

  const myPhotoKey = photoKeyFor(f, i, 'myphoto');
  const amazonPhotoKey = photoKeyFor(f, i, 'amazonphoto');
  const myPhotoCloudUrl = cloudinaryUrl(myPhotoKey);
  const amazonPhotoCloudUrl = cloudinaryUrl(amazonPhotoKey);

  // Restore a previously uploaded photo — try the cloud copy first (works on
  // any device), fall back to this device's local cache if the cloud copy
  // isn't there yet (e.g. upload to Cloudinary failed after saving locally).
  (async () => {
    if (await tryLoadImage(myPhotoCloudUrl)) {
      photoBox.innerHTML = `<img src="${myPhotoCloudUrl}">`;
      card.dataset.hasPhoto = 'true';
      applyFilter();
    } else {
      const dataUrl = await loadPhotoFromDB(myPhotoKey);
      if (dataUrl) {
        photoBox.innerHTML = `<img src="${dataUrl}">`;
        card.dataset.hasPhoto = 'true';
        applyFilter();
      }
    }
  })();
  (async () => {
    if (await tryLoadImage(amazonPhotoCloudUrl)) {
      amazonBox.innerHTML = `<img src="${amazonPhotoCloudUrl}">`;
    } else {
      const dataUrl = await loadPhotoFromDB(amazonPhotoKey);
      if (dataUrl) {
        amazonBox.innerHTML = `<img src="${dataUrl}">`;
      }
    }
  })();

  const openPicker = () => fileInput.click();
  photoBox.addEventListener('click', openPicker);
  pickBtn.addEventListener('click', openPicker);

  const openAmazonPicker = () => amazonInput.click();
  amazonBox.addEventListener('click', openAmazonPicker);
  pickAmazonBtn.addEventListener('click', openAmazonPicker);

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      photoBox.innerHTML = `<img src="${ev.target.result}">`;
      card.dataset.hasPhoto = 'true';
      savePhotoToDB(myPhotoKey, ev.target.result);
    };
    reader.readAsDataURL(file);
    uploadToCloudinary(file, myPhotoKey).catch(err => console.warn('No se pudo subir a la nube:', err));
  });

  amazonInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      amazonBox.innerHTML = `<img src="${ev.target.result}">`;
      savePhotoToDB(amazonPhotoKey, ev.target.result);
    };
    reader.readAsDataURL(file);
    uploadToCloudinary(file, amazonPhotoKey).catch(err => console.warn('No se pudo subir a la nube:', err));
  });

  dlBtn.addEventListener('click', async () => {
    dlBtn.textContent = '...';
    const canvas = await html2canvas(card.querySelector('.flyer'), {scale: 3, backgroundColor: null, useCORS: true});
    const filename = f.name.replace(/[^a-z0-9]+/gi, '_') + '.png';
    await saveCanvasImage(canvas, filename);
    dlBtn.textContent = 'Descargar';
  });
});

function updateSelectedCount() {
  const n = document.querySelectorAll('.card[data-selected="true"]').length;
  document.getElementById('selectedCount').textContent = n;
}

function applyFilter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const hideNoPhoto = document.getElementById('btnHideDone').dataset.active === 'true';
  let visible = 0;
  document.querySelectorAll('.card').forEach(card => {
    const matchesSearch = !q || card.dataset.name.includes(q) || card.dataset.num.includes(q);
    const matchesPhoto = !hideNoPhoto || card.dataset.hasPhoto === 'true';
    const show = matchesSearch && matchesPhoto;
    card.dataset.hidden = show ? 'false' : 'true';
    if (show) visible++;
  });
  visibleCount.textContent = visible + ' / ' + FUNKOS.length;
}

document.getElementById('search').addEventListener('input', () => {
  document.getElementById('btnClearSearch').classList.toggle('show', document.getElementById('search').value.length > 0);
  applyFilter();
});

document.getElementById('btnClearSearch').addEventListener('click', () => {
  const search = document.getElementById('search');
  search.value = '';
  document.getElementById('btnClearSearch').classList.remove('show');
  applyFilter();
  search.focus();
});

document.getElementById('btnSelectAll').addEventListener('click', () => {
  const visibleCards = Array.from(document.querySelectorAll('.card')).filter(c => c.dataset.hidden !== 'true');
  if (visibleCards.length === 0) return;
  const allAlreadySelected = visibleCards.every(c => c.dataset.selected === 'true');
  visibleCards.forEach(c => {
    c.dataset.selected = allAlreadySelected ? 'false' : 'true';
    const box = c.querySelector('.select-box');
    if (box) box.checked = !allAlreadySelected;
  });
  updateSelectedCount();
});

document.getElementById('btnClearPhotos').addEventListener('click', async () => {
  if (!confirm('Esto borra la caché LOCAL de fotos en este dispositivo (las copias en la nube de Cloudinary no se tocan). ¿Seguro?')) return;
  await clearAllSavedPhotos();
  location.reload();
});

const btnHideDone = document.getElementById('btnHideDone');
btnHideDone.dataset.active = 'false';
btnHideDone.addEventListener('click', () => {
  const active = btnHideDone.dataset.active === 'true';
  btnHideDone.dataset.active = active ? 'false' : 'true';
  btnHideDone.textContent = active ? 'Ocultar sin foto' : 'Mostrar todos';
  applyFilter();
});

document.getElementById('btnZip').addEventListener('click', async () => {
  const progress = document.getElementById('progress');
  const targets = Array.from(document.querySelectorAll('.card')).filter(c => c.dataset.hasPhoto === 'true');
  if (targets.length === 0) {
    alert('Agrega al menos una foto antes de descargar el ZIP.');
    return;
  }
  if (isIOS) {
    alert('En navegadores de iPad/iPhone el ZIP puede fallar. Mejor usa "Descargar" en cada tarjeta \u2014 ahora usa el men\u00fa nativo de compartir o descarga directa, que funciona mejor en m\u00f3vil.');
    return;
  }
  progress.style.display = 'block';
  const zip = new JSZip();
  for (let i = 0; i < targets.length; i++) {
    const card = targets[i];
    progress.textContent = `Generando ${i+1} / ${targets.length}...`;
    const canvas = await html2canvas(card.querySelector('.flyer'), {scale: 3, backgroundColor: null, useCORS: true});
    const dataUrl = canvas.toDataURL('image/png').split(',')[1];
    const name = card.querySelector('.name').textContent.replace(/[^a-z0-9]+/gi, '_');
    zip.file(name + '.png', dataUrl, {base64: true});
  }
  progress.textContent = 'Empaquetando ZIP...';
  const blob = await zip.generateAsync({type: 'blob'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'flyers_funkos.zip';
  link.click();
  progress.style.display = 'none';
});

document.getElementById('btnDownloadSelected').addEventListener('click', async () => {
  const progress = document.getElementById('progress');
  const targets = Array.from(document.querySelectorAll('.card[data-selected="true"]'));
  if (targets.length === 0) {
    alert('Marca al menos una tarjeta con la casilla de la esquina antes de descargar.');
    return;
  }

  if (isIOS) {
    // No popups/zip reliability on iOS — reuse the same per-card save flow
    // (native share sheet first, blob download as fallback), one after another.
    for (let i = 0; i < targets.length; i++) {
      const card = targets[i];
      progress.style.display = 'block';
      progress.textContent = `Guardando ${i+1} / ${targets.length}...`;
      const canvas = await html2canvas(card.querySelector('.flyer'), {scale: 3, backgroundColor: null, useCORS: true});
      const filename = card.querySelector('.name').textContent.replace(/[^a-z0-9]+/gi, '_') + '.png';
      await saveCanvasImage(canvas, filename);
    }
    progress.style.display = 'none';
    return;
  }

  progress.style.display = 'block';
  const zip = new JSZip();
  for (let i = 0; i < targets.length; i++) {
    const card = targets[i];
    progress.textContent = `Generando ${i+1} / ${targets.length}...`;
    const canvas = await html2canvas(card.querySelector('.flyer'), {scale: 3, backgroundColor: null, useCORS: true});
    const dataUrl = canvas.toDataURL('image/png').split(',')[1];
    const name = card.querySelector('.name').textContent.replace(/[^a-z0-9]+/gi, '_');
    zip.file(name + '.png', dataUrl, {base64: true});
  }
  progress.textContent = 'Empaquetando ZIP...';
  const blob = await zip.generateAsync({type: 'blob'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'flyers_seleccionados.zip';
  link.click();
  progress.style.display = 'none';
});
</script>
</body>
</html>
